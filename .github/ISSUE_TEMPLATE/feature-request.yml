name: Feature request
description: Suggest a PulseEngine capability or workflow.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What engineering problem are you trying to solve?
    validations:
      required: true

  - type: textarea
    id: current
    attributes:
      label: How do you handle it today?
    validations:
      required: true

  - type: textarea
    id: desired
    attributes:
      label: What would you want PulseEngine to do?
    validations:
      required: true

  - type: textarea
    id: frequency
    attributes:
      label: How often does this problem occur?
