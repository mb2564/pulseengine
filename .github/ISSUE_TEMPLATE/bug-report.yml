name: Bug report
description: Report a PulseEngine beta failure without sharing proprietary code.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please sanitize logs. Do not include proprietary source, secrets, customer data, or private URLs.

  - type: input
    id: version
    attributes:
      label: PulseEngine version/build
      placeholder: 0.3.0-beta.15
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Windows 11 / Node 22.x / React 19 / Vite 7
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: Command
      placeholder: npx pulseengine scan --config pulseengine.config.json
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What happened?
      description: Sanitized output only.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction notes
      description: High-level steps; do not paste proprietary code.
